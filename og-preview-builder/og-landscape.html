<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Preview — Akash Gangurde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F5F4F0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: #F5F4F0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      position: relative;
      overflow: hidden;
    }

    /* ── LEFT COLUMN ── */
    .left {
      flex: 0 0 660px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px 56px 0 64px;
    }

    .top-content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #6F6F6A;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .heading {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #1B1B1A;
      margin-bottom: 20px;
    }

    .heading span {
      color: #D94732;
    }

    .description {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: #6F6F6A;
      max-width: 480px;
      margin-bottom: 28px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(27, 27, 26, 0.15);
      margin-bottom: 0;
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 0;
      padding: 28px 0 0 0;
      margin-bottom: 0;
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 36px;
    }

    .stat-block:not(:last-child) {
      border-right: 1px solid rgba(27, 27, 26, 0.15);
      margin-right: 36px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #1B1B1A;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .stat-label {
      font-size: 11.5px;
      font-weight: 500;
      color: #6F6F6A;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      width: 660px;
      height: 5px;
      background: #D94732;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    /* ── RIGHT COLUMN ── */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 48px 36px 24px;
      background: #F5F4F0;
      position: relative;
    }

    .photo-card {
      width: 320px;
      height: 430px;
      background: #E9E8E3;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 32px rgba(27, 27, 26, 0.10);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .accent-dot {
      position: absolute;
      bottom: 56px;
      right: 44px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #D94732;
    }

    /* full-width red bar at bottom */
    .full-bottom-bar {
      width: 1200px;
      height: 5px;
      background: #D94732;
      position: absolute;
      bottom: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- LEFT -->
    <div class="left">
      <div class="top-content">
        <p class="eyebrow">UX/UI Designer &nbsp;·&nbsp; imakash.in</p>
        <h1 class="heading">Designing Scalable<br>UX Systems for<br>Real-World Products</h1>
        <p class="description">I design intuitive digital products through research,<br>systems thinking and AI-powered workflows.</p>
        <div class="divider"></div>
      </div>

      <div class="stats">
        <div class="stat-block">
          <span class="stat-number">2000+</span>
          <span class="stat-label">Users Impacted</span>
        </div>
        <div class="stat-block">
          <span class="stat-number">4+</span>
          <span class="stat-label">Projects Delivered</span>
        </div>
        <div class="stat-block">
          <span class="stat-number">100%</span>
          <span class="stat-label">End-to-End UX</span>
        </div>
      </div>

      <!-- padding spacer -->
      <div style="height: 36px;"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="photo-card">
        <img src="../src/images/profile/hero-profile.jpg" alt="Akash Gangurde" />
      </div>
      <div class="accent-dot"></div>
    </div>

    <!-- Bottom vermilion bar -->
    <div class="full-bottom-bar"></div>

  </div>
</body>
</html>
