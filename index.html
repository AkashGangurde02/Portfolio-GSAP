  <!-- Chatbase bubble button nudge + chat window responsive override -->
  <style>
    /* ── Bubble button — position set dynamically by JS to align with View Work btn ── */
    #chatbase-bubble-button {
      transform: none !important;
    }

    /* ── Hide the "Hi! What can I help you with?" nudge tooltip ── */
    #chatbase-bubble-tooltip,
    .chatbase-bubble-tooltip,
    [id*="chatbase"][id*="tooltip"],
    [class*="chatbase"][class*="tooltip"],
    [id*="chatbase"][id*="nudge"],
    [class*="chatbase"][class*="nudge"],
    [id*="chatbase"][id*="message-bubble"],
    [class*="chatbase"][class*="message-bubble"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ── Desktop: chat window (default) ── */
    #chatbase-bubble-window {
      height: 460px !important;
      max-height: 460px !important;
      min-height: unset !important;
      width: 420px !important;
    }

    /* ── Desktop: inner iframe ── */
    #chatbase-bubble-window iframe {
      height: 460px !important;
      max-height: 460px !important;
      min-height: unset !important;
      width: 420px !important;
    }

    /* ── Tablet (≤ 768px) ── */
    @media (max-width: 768px) {
      #chatbase-bubble-button {
        transform: translateY(-40px) !important;
      }
      #chatbase-bubble-window {
        height: 55vh !important;
        max-height: 55vh !important;
        width: 92vw !important;
        max-width: 400px !important;
        right: 16px !important;
        bottom: 80px !important;
      }
      #chatbase-bubble-window iframe {
        height: 55vh !important;
        max-height: 55vh !important;
        width: 100% !important;
      }
    }

    /* ── Large phones (≤ 480px) ── */
    @media (max-width: 480px) {
      #chatbase-bubble-button {
        transform: translateY(-40px) !important;
      }
      #chatbase-bubble-window {
        height: 58vh !important;
        max-height: 58vh !important;
        width: 96vw !important;
        max-width: unset !important;
        right: 8px !important;
        bottom: 72px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
      #chatbase-bubble-window iframe {
        height: 58vh !important;
        max-height: 58vh !important;
        width: 100% !important;
      }
    }

    /* ── Small phones (≤ 360px) ── */
    @media (max-width: 360px) {
      #chatbase-bubble-button {
        transform: translateY(-40px) !important;
      }
      #chatbase-bubble-window {
        height: 52vh !important;
        max-height: 52vh !important;
        width: 100vw !important;
        right: 0 !important;
        left: 0 !important;
        bottom: 64px !important;
        transform: none !important;
        border-radius: 0 !important;
      }
      #chatbase-bubble-window iframe {
        height: 52vh !important;
        max-height: 52vh !important;
        width: 100% !important;
        border-radius: 0 !important;
      }
    }
